# Nome do aplicativo
spring.application.name=biblioteca

# Porta do servidor
server.port=8080

# ===============================
# Configuração do MySQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3306/biblioteca?useSSL=false&serverTimezone=UTC
spring.datasource.username=root
# IMPORTANTE: troque "sua_senha_aqui" pela senha que você definir ao instalar o MySQL
spring.datasource.password=

# Dialeto do MySQL
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Cria/atualiza as tabelas automaticamente ao iniciar o projeto
spring.jpa.hibernate.ddl-auto=update

# Mostra as queries SQL no console (útil para ver o que está acontecendo)
spring.jpa.show-sql=true

# ===============================
# Testcontainers (testes)
# ===============================
# Não mexa aqui! O Testcontainers configura
# o banco de testes automaticamente.